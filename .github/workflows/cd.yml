# CD — deploy das Edge Functions quando main recebe push
#
# Roda somente em push direto para main (merge de PR).
# Faz deploy de todas as Edge Functions do projeto via Supabase CLI.
#
# Secrets necessários (Settings > Secrets > Actions):
#   SUPABASE_ACCESS_TOKEN  → Supabase Dashboard > Account > Access Tokens
#   SUPABASE_PROJECT_ID    → mfhienxxxaeyerjaoovx

name: CD

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy market-snapshot
        run: supabase functions deploy market-snapshot --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy weather-sync
        run: supabase functions deploy weather-sync --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

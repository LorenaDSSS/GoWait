# CI — roda em todo PR aberto para dev ou main
#
# Verifica:
#   1. Lint (expo lint)
#   2. Typecheck (tsc --noEmit)
#
# Se qualquer check falhar, o merge fica bloqueado.
# Configurar branch protection rules no GitHub:
#   Settings > Branches > Add rule > "ci" como required status check

name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
